<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>과학 수업 시뮬레이션</title>
<style>
:root{--bg:#f3f6f8;--fg:#14222b;--muted:#5a6b76;--line:#d5dee4;--accent:#0b6e8a}
@media (prefers-color-scheme: dark){:root{--bg:#0f171d;--fg:#e4edf2;--muted:#93a6b2;--line:#2a3a45;--accent:#4fb3cf;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6}
main{max-width:720px;margin:0 auto;padding:32px 16px}
h1{font-size:1.5rem;margin:0 0 4px}
p{color:var(--muted);margin:0 0 24px}
ul{list-style:none;padding:0;margin:0;display:grid;gap:12px}
li{border:1px solid var(--line);border-radius:10px;padding:14px 16px}
a{color:var(--accent);font-weight:700;text-decoration:none}
a:hover,a:focus-visible{text-decoration:underline}
small{display:block;color:var(--muted)}
</style>
</head>
